# The checks of `npm run verify` (scripts/verify.mjs) on every push and pull request to main.
# The browser tests and the rig suite run locally; a release is made by scripts/release.mjs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
