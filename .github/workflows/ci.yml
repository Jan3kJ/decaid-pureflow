# The checks of `npm run verify` (scripts/verify.mjs) on every push and pull request to main, and
# the browser tests on the mocked gateway (`npm run e2e`, about 11 minutes). The rig suite needs a
# running Decaid and runs locally; a release is made by scripts/release.mjs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The reporter also writes each failure as an annotation on the run's page; the whole log
      # is `gh run view <run id> --log-failed`. The output is kept for the summary below.
      - name: npm run e2e
        shell: bash
        run: npm run e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      - name: Summary of the failed tests
        if: failure()
        shell: bash
        run: |
          failed=$(grep -oE '✘ +[0-9]+ \[[a-z]+\] › [^ ]+' "$RUNNER_TEMP/e2e.log" | sed -E 's/.* › //' | sort -u | paste -sd ' ' - || true)
          echo "e2e failed: ${failed:-no test failed, see the log}" | tee -a "$GITHUB_STEP_SUMMARY"
      # e2e/.results/ is a hidden folder: the trace, picture and error context of each failed test.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: e2e/.results/
          include-hidden-files: true
          retention-days: 14
